name: Download totals

# Keeps the running download totals of the ci-latest files up to date (GitHub resets a file's count when a build
# replaces it): every 6 hours, and on demand. Writes totals.json to the download-stats release (the README badge reads
# it) and a "Downloads so far" line into the ci-latest release notes.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  totals:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: tools/ci
    - name: "Count and publish"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for a in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/ci-latest" --jq '.assets[].name'); do
          bash tools/ci/keep_download_count.sh "$a" || true
        done
        bash tools/ci/keep_download_count.sh --json
